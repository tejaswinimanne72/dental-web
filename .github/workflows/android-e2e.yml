name: 📱 Enterprise Android E2E Appium & GitHub Pages CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily midnight run

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    name: 🚀 Enterprise Android E2E Pipeline (21 Stages)
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Checkout Repository
      - name: 📁 Stage 1: Checkout Repository
        uses: actions/checkout@v4

      # Stage 2: Setup Java
      - name: ☕ Stage 2: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Stage 3: Setup Android SDK
      - name: 🤖 Stage 3: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Stage 4: Install Node.js & Dependencies
      - name: 🟢 Stage 4: Install Node.js & Appium Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd automation
          npm install

      # Stage 5: Build APK
      - name: 🔨 Stage 5: Build APK / Verify Android APK Asset
        run: |
          if [ -f "dental_clinic_app.apk" ]; then
            echo "✅ Verified existing production Android APK: dental_clinic_app.apk"
          elif [ -d "Frontend/android" ]; then
            cd Frontend/android
            chmod +x gradlew
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../dental_clinic_app.apk
          fi

      # Stage 6 & 7: Start Android Emulator & Verify Readiness
      - name: 📱 Stage 6 & 7: Start Android Emulator & Verify Readiness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          script: |
            echo "✅ Android Emulator Ready:"
            adb devices
            
            # Stage 8: Install APK
            echo "📲 Stage 8: Installing APK..."
            adb install -r dental_clinic_app.apk
            
            # Stage 9: Start Appium Server
            echo "⚡ Stage 9: Starting Appium Server..."
            npx appium --port 4723 &
            sleep 10
            
            # Stage 10: Verify Appium Health
            echo "🩺 Stage 10: Verifying Appium Health..."
            curl -f http://127.0.0.1:4723/status || echo "Appium status checked"
            
            # Stage 11: Execute Appium E2E Tests (400+ Test Cases)
            echo "🧪 Stage 11: Executing 400+ Appium E2E Test Cases..."
            cd automation
            npm run test:e2e
            
            # Stage 12 & 13: Capture Screenshots & Device Logs
            echo "📸 Stage 12 & 13: Capturing Logs & Screenshots..."
            mkdir -p ../logs
            adb logcat -d > ../logs/android_device.log

      # Stage 14, 15, 16, 17: Reports Generation Verification
      - name: 📊 Stage 14-17: Verify Multi-Format Reports Generation
        run: |
          ls -la "Test Results/Excel"
          ls -la "Test Results/HTML"
          ls -la "Test Results/JSON"
          ls -la "Test Results/Summary"

      # Stage 18: Upload Artifacts
      - name: 📦 Stage 18: Upload Execution Artifacts (30 Days Retention)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enterprise-e2e-test-results-build-${{ github.run_number }}
          path: |
            Test Results/
            automation/screenshots/
            logs/
          retention-days: 30

      # Stage 19 & 20: Prepare GitHub Pages & Archive History
      - name: 🌐 Stage 19 & 20: Prepare GitHub Pages Folder Structure & Historical Archives
        if: always()
        run: |
          mkdir -p public/reports/latest
          mkdir -p public/reports/history/build-${{ github.run_number }}
          
          # Copy Reports to Latest
          cp -r "Test Results/HTML/"* public/reports/latest/
          cp -r "Test Results/Excel/"* public/reports/latest/
          cp -r "Test Results/Summary/"* public/reports/latest/
          
          # Copy Reports to Build History
          cp -r "Test Results/HTML/"* public/reports/history/build-${{ github.run_number }}/
          cp -r "Test Results/Excel/"* public/reports/history/build-${{ github.run_number }}/

      - name: 🚀 Stage 19: Deploy Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      # Stage 21: Publish GitHub Action Summary
      - name: 📝 Stage 21: Publish GitHub Action Summary
        if: always()
        run: |
          cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
