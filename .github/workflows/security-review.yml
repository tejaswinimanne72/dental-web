name: 🛡️ Enterprise DevSecOps Backend Security Review & SAST/DAST Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  devsecops-audit:
    name: 🔍 Comprehensive DevSecOps Audit & Security Scanning
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: 📁 Checkout Codebase
        uses: actions/checkout@v4

      # Step 2: Auto-detect Technology Stack & Setup Node.js
      - name: 🔎 Detect Stack & Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Run Semgrep Static Code Analysis (SAST)
      - name: 🛡️ Run Semgrep SAST Code Scanner
        run: |
          python3 -m pip install semgrep
          semgrep --config p/security-audit --config p/owasp-top-10 --json --output semgrep-results.json . || true

      # Step 4: Run Trivy Vulnerability & Secret Scanner
      - name: 📦 Run Trivy Dependency & Secret Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'

      # Step 5: Run Gitleaks Secret Detection
      - name: 🔑 Run Gitleaks Hardcoded Credentials Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Step 6: Execute API Performance Benchmark (k6)
      - name: ⚡ Run k6 Load Benchmark Tests
        uses: grafana/k6-action@v0.3.0
        with:
          filename: 'Vulnerability Test Results/k6-load-test.js'
        continue-on-error: true

      # Step 7: Upload Vulnerability Audit Artifacts
      - name: 📦 Upload Vulnerability Test Results & Excel Audit Packages
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-audit-artifacts-${{ github.run_number }}
          path: |
            Vulnerability Test Results/
            semgrep-results.json
          retention-days: 30

      # Step 8: Publish GitHub Action Step Summary
      - name: 📝 Publish Security Audit GitHub Action Summary
        if: always()
        run: |
          cat "Vulnerability Test Results/executive-summary.md" >> $GITHUB_STEP_SUMMARY
