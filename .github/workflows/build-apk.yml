name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Build Android Application (.APK)
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Build Android APK Binary
        run: |
          if [ -f "dental_clinic_app.apk" ]; then
            echo "✅ Verified existing production Android APK: dental_clinic_app.apk"
          elif [ -d "Frontend/android" ]; then
            cd Frontend
            npm install
            npm run build
            npx cap sync android
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../dental_clinic_app.apk
          fi

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dental-clinic-app-apk
          path: dental_clinic_app.apk
          retention-days: 30
